{% extends "layout.html" %}
{% block content %}

<div class="container-narrow" style="padding-top:40px;">
  <div class="auth-card">
    <h2>Create Account</h2>
    <p class="auth-subtitle">Join Bookshelf and start reading</p>

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="POST">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
        <div class="form-group">
          <label>First Name</label>
          <input type="text" name="first_name" required placeholder="Jane">
        </div>
        <div class="form-group">
          <label>Last Name</label>
          <input type="text" name="last_name" required placeholder="Smith">
        </div>
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="email" required placeholder="you@example.com" autocomplete="email">
      </div>

      <div class="form-group">
        <label>Phone <span style="font-weight:400;color:var(--muted);">(optional)</span></label>
        <input type="text" name="phone" placeholder="(555) 000-0000">
      </div>

      <div class="form-group">
        <label>Address <span style="font-weight:400;color:var(--muted);">(optional)</span></label>
        <input type="text" name="address" placeholder="123 Main St, City, ST 00000">
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required placeholder="Choose a strong password" autocomplete="new-password">
      </div>

      <button type="submit" class="btn btn-primary" style="width:100%;padding:12px;font-size:0.95rem;margin-top:6px;">
        Create Account
      </button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="/login">Sign in</a>
    </div>
  </div>
</div>

{% endblock %}
