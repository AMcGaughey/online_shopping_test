{% extends "layout.html" %}
{% block content %}
<div class="page-header">
  <h1>Add Inventory</h1>
  <span class="subtitle">Create or restock inventory for a store</span>
</div>

<form method="POST" class="auth-card" style="max-width:700px;margin:auto;">
  <div class="form-group">
    <label>Store Location</label>
    <select name="location_id" required>
      {% for store in stores %}
      <option value="{{ store.location_id }}">Store #{{ store.location_id }} - {{ store.address }}</option>
      {% endfor %}
    </select>
  </div>

  <div class="form-group">
    <label>Book</label>
    <select name="isbn" required>
      {% for book in books %}
      <option value="{{ book.isbn }}">{{ book.title }} ({{ book.isbn }})</option>
      {% endfor %}
    </select>
  </div>

  <div class="form-group">
    <label>Quantity</label>
    <input type="number" name="quantity" min="1" required>
  </div>

  <div class="form-group">
    <label>Price</label>
    <input type="number" name="price" step="0.01" min="0" required>
  </div>

  <div style="display:flex;gap:12px;">
    <button type="submit" class="btn btn-primary">Save Inventory</button>
    <a href="/inventory" class="btn btn-outline">Cancel</a>
  </div>
</form>
{% endblock %}
