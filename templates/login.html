{% extends "layout.html" %}
{% block content %}

<div class="container-narrow" style="padding-top:50px;">
  <div class="auth-card">
    <h2>Welcome Back</h2>
    <p class="auth-subtitle">Sign in to your Bookshelf account</p>

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="POST">

      <!-- Customer login -->
      <div class="section-title" style="font-size:0.8rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);">Customer</div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="email" placeholder="you@example.com" autocomplete="email">
      </div>

      <div class="form-divider">or sign in as manager</div>

      <!-- Manager login -->
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" placeholder="manager username" autocomplete="username">
      </div>

      <!-- Shared password -->
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn btn-primary" style="width:100%;padding:12px;font-size:0.95rem;margin-top:6px;">
        Sign In
      </button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a href="/register">Create one</a>
    </div>
  </div>
</div>

{% endblock %}
