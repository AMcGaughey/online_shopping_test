{% extends "layout.html" %}
{% block content %}

<div class="container-narrow" style="padding-top:50px;">
  <div class="auth-card">
    <h2>Welcome Back</h2>
    <p class="auth-subtitle">Sign in with your email — works for both customers and managers</p>

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="POST">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="email" placeholder="you@example.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn btn-primary" style="width:100%;padding:12px;font-size:0.95rem;margin-top:6px;">
        Sign In
      </button>
    </form>

    <div class="auth-footer">
      New customer? <a href="/register">Create an account</a>
    </div>
  </div>
</div>

{% endblock %}
