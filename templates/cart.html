{% extends "layout.html" %}
{% block content %}

<h2>Your Cart</h2>

{% if cart %}
<table>
    <tr>
        <th>Title</th>
        <th>Qty</th>
        <th>Price</th>
        <th>Total</th>
    </tr>

    {% for item in cart %}
    <tr>
        <td>{{ item.title }}</td>
        <td>{{ item.quantity }}</td>
        <td>${{ item.price }}</td>
        <td>${{ item.quantity * item.price }}</td>
    </tr>
    {% endfor %}
</table>

<form method="POST" action="/checkout">
    <button type="submit">Checkout</button>
</form>

{% else %}
<p>Your cart is empty.</p>
{% endif %}

{% endblock %}
