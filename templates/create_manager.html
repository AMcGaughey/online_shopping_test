{% extends "layout.html" %}
{% block content %}

<div class="container-narrow" style="padding-top:40px;">
  <div class="auth-card">
    <h2>Add New Manager</h2>
    <p class="auth-subtitle">Manager accounts can only be created by existing managers</p>

    {% if success %}
    <div class="alert alert-success">✓ Manager account created. They can now log in.</div>
    {% endif %}

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="POST">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
        <div class="form-group">
          <label>First Name</label>
          <input type="text" name="first_name" required placeholder="Jane">
        </div>
        <div class="form-group">
          <label>Last Name</label>
          <input type="text" name="last_name" required placeholder="Smith">
        </div>
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="email" required placeholder="manager@example.com">
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required placeholder="Choose a strong password">
      </div>

      <button type="submit" class="btn btn-primary" style="width:100%;padding:12px;font-size:0.95rem;margin-top:6px;">
        Create Manager Account
      </button>
    </form>

    <div style="margin-top:16px;">
      <a href="/manager" class="btn btn-outline" style="width:100%;display:flex;justify-content:center;">
        Back to Dashboard
      </a>
    </div>
  </div>
</div>

{% endblock %}
