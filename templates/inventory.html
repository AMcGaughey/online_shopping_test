{% extends "layout.html" %}
{% block content %}

<h2>Inventory</h2>

<table>
    <tr>
        <th>ISBN</th>
        <th>Title</th>
        <th>Quantity</th>
        <th>Price</th>
    </tr>

    {% for item in inventory %}
    <tr>
        <td>{{ item.isbn }}</td>
        <td>{{ item.book.title }}</td>
        <td>{{ item.quantity }}</td>
        <td>${{ item.price }}</td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
