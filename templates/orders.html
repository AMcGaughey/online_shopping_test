{% extends "layout.html" %}
{% block content %}

<h2>Orders</h2>

<table>
    <tr>
        <th>Order ID</th>
        <th>Customer</th>
        <th>Date</th>
        <th>Total</th>
        <th>Status</th>
    </tr>

    {% for order in orders %}
    <tr>
        <td>{{ order.order_id }}</td>
        <td>{{ order.customer.first_name }} {{ order.customer.last_name }}</td>
        <td>{{ order.date }}</td>
        <td>${{ order.total }}</td>
        <td>{{ order.status }}</td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
